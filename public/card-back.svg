<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1125" width="800" height="1125">
  <defs>
    <linearGradient id="backBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="headerBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <clipPath id="cardClipBack">
      <rect x="0" y="0" width="800" height="1125" rx="36" ry="36" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClipBack)">
    <!-- Base Clean White/Ivory Card -->
    <rect width="800" height="1125" fill="url(#backBg)" />

    <!-- Subtle Security Micro-Pattern Grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e2e8f0" stroke-width="0.6" opacity="0.5" />
    </pattern>
    <rect width="800" height="1125" fill="url(#grid)" />

    <!-- Header Banner -->
    <rect x="0" y="0" width="800" height="130" fill="url(#headerBack)" />
    <line x1="0" y1="130" x2="800" y2="130" stroke="#c59b27" stroke-width="2" />

    <text x="400" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="2.2" text-anchor="middle">
